<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuestro Universo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Georgia, "Times New Roman", serif;
        }

        #contenedor {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }


        /* =====================================================
           ENTRADA
        ===================================================== */

        #entrada {
            position: fixed;
            inset: 0;
            z-index: 500;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #09091c 0%,
                    #020207 45%,
                    #000 100%
                );

            transition:
                opacity 1.8s ease,
                visibility 1.8s ease;
        }

        #entrada.oculta {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* ESTRELLAS DE LA ENTRADA */

        #estrellasEntrada {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .estrellaEntrada {
            position: absolute;

            width: 2px;
            height: 2px;

            background: white;
            border-radius: 50%;

            box-shadow:
                0 0 5px white,
                0 0 12px #7777ff;

            opacity: 0;

            animation:
                aparecerEstrella 2s ease forwards,
                parpadeoEntrada 3s ease-in-out infinite;
        }

        @keyframes aparecerEstrella {

            from {
                opacity: 0;
            }

            to {
                opacity: .8;
            }

        }

        @keyframes parpadeoEntrada {

            0%,
            100% {
                transform: scale(.7);
                opacity: .35;
            }

            50% {
                transform: scale(1.4);
                opacity: 1;
            }

        }


        /* =====================================================
           AGUJERO NEGRO DE LA ENTRADA
        ===================================================== */

        #agujeroEntrada {

            position: absolute;

            width: 240px;
            height: 240px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    #000 0%,
                    #000 42%,
                    transparent 43%
                );

            box-shadow:

                0 0 25px #7066ff,
                0 0 60px rgba(100,80,255,.7),
                0 0 120px rgba(70,50,255,.35);

            animation:
                agujeroFlotando 5s ease-in-out infinite;

        }

        #agujeroEntrada::before {

            content: "";

            position: absolute;

            inset: -45px;

            border-radius: 50%;

            border: 14px solid transparent;

            border-top-color: #fff;
            border-right-color: #a18cff;
            border-bottom-color: #5b46ff;

            filter: blur(7px);

            transform:
                rotate(-20deg)
                scaleY(.32);

            animation:
                discoEntrada 3s linear infinite;

        }

        #agujeroEntrada::after {

            content: "";

            position: absolute;

            inset: -80px;

            border-radius: 50%;

            border: 2px solid rgba(160,150,255,.3);

            filter: blur(3px);

            transform:
                scaleY(.25);

            animation:
                discoEntrada 7s linear infinite reverse;

        }

        @keyframes agujeroFlotando {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-12px) scale(1.03);
            }

        }

        @keyframes discoEntrada {

            from {
                transform:
                    rotate(0deg)
                    scaleY(.32);
            }

            to {
                transform:
                    rotate(360deg)
                    scaleY(.32);
            }

        }


        /* =====================================================
           TEXTO DE ENTRADA
        ===================================================== */

        #contenidoEntrada {

            position: absolute;

            bottom: 80px;

            width: 100%;

            text-align: center;

            color: white;

            opacity: 0;

            animation:
                aparecerEntrada 2s ease 2s forwards;

        }

        #contenidoEntrada .pequeno {

            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 7px;

            opacity: .55;

            margin-bottom: 18px;

        }

        #contenidoEntrada h1 {

            font-family: Arial, sans-serif;

            font-weight: 200;

            font-size: clamp(30px, 5vw, 58px);

            letter-spacing: 12px;

            text-shadow:

                0 0 10px white,
                0 0 30px #7165ff,
                0 0 70px #4b3cff;

            margin-bottom: 14px;

        }

        #contenidoEntrada p {

            font-family: Arial, sans-serif;

            font-size: 13px;

            letter-spacing: 3px;

            opacity: .65;

            margin-bottom: 35px;

        }

        @keyframes aparecerEntrada {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================================
           BOTON ENTRAR
        ===================================================== */

        #entrar {

            position: relative;

            padding: 15px 42px;

            border: 1px solid rgba(255,255,255,.4);

            border-radius: 40px;

            background:
                rgba(255,255,255,.04);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 4px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition:
                transform .3s ease,
                background .3s ease,
                box-shadow .3s ease;

        }

        #entrar:hover {

            transform: scale(1.06);

            background:
                rgba(120,100,255,.18);

            box-shadow:

                0 0 25px rgba(120,100,255,.5),
                0 0 60px rgba(100,80,255,.2);

        }


        /* =====================================================
           TITULO PRINCIPAL
        ===================================================== */

        #titulo {

            position: fixed;

            top: 35px;

            left: 0;

            width: 100%;

            text-align: center;

            color: white;

            z-index: 20;

            pointer-events: none;

            opacity: 0;

            transition: opacity 2s ease;

            text-shadow:

                0 0 10px white,
                0 0 25px #7777ff,
                0 0 50px #5555ff;

        }

        #titulo.visible {
            opacity: 1;
        }

        #titulo h1 {

            font-family: Arial, sans-serif;

            font-size: 30px;

            font-weight: 300;

            letter-spacing: 8px;

        }

        #titulo p {

            margin-top: 10px;

            font-family: Arial, sans-serif;

            font-size: 13px;

            opacity: .7;

            letter-spacing: 3px;

        }


        /* =====================================================
           AYUDA
        ===================================================== */

        #ayuda {

            position: fixed;

            right: 20px;

            bottom: 20px;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 11px;

            opacity: 0;

            z-index: 20;

            transition: opacity 2s ease;

        }

        #ayuda.visible {
            opacity: .45;
        }


        /* =====================================================
           MENSAJE
        ===================================================== */

        #mensajePantalla {

            position: fixed;

            inset: 0;

            background:

                radial-gradient(
                    circle at center,
                    rgba(45,35,100,.35),
                    rgba(0,0,10,.96)
                );

            backdrop-filter: blur(15px);

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 100;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .5s ease,
                visibility .5s ease;

        }

        #mensajePantalla.visible {

            opacity: 1;
            visibility: visible;

        }


        /* =====================================================
           SOBRE
        ===================================================== */

        .sobre {

            position: relative;

            width: min(650px, 88vw);

            min-height: 400px;

            padding: 70px 55px 55px;

            background:

                linear-gradient(
                    145deg,
                    #f8f2e8,
                    #e9dcc8
                );

            color: #292338;

            border-radius: 8px;

            box-shadow:

                0 0 30px rgba(255,255,255,.15),
                0 0 100px rgba(100,80,255,.25);

            transform:
                scale(.4)
                rotateX(35deg);

            opacity: 0;

            transition:
                transform .8s cubic-bezier(.2,.8,.2,1),
                opacity .6s ease;

        }

        #mensajePantalla.visible .sobre {

            transform:
                scale(1)
                rotateX(0deg);

            opacity: 1;

        }


        .papel {
            text-align: center;
        }

        .papel .pequeno {

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 4px;

            color: #766b82;

            text-transform: uppercase;

            margin-bottom: 25px;

        }

        .papel h2 {

            font-size: 32px;

            font-weight: normal;

            margin-bottom: 30px;

            color: #403353;

        }

        .papel p {

            font-size: 23px;

            line-height: 1.7;

        }


        .sello {

            position: absolute;

            top: 25px;

            right: 30px;

            width: 55px;

            height: 55px;

            border-radius: 50%;

            background: #6c58a8;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            box-shadow:
                0 5px 15px rgba(0,0,0,.2);

        }


        #cerrarMensaje {

            position: absolute;

            top: 20px;

            left: 25px;

            width: 35px;

            height: 35px;

            border: none;

            border-radius: 50%;

            background: rgba(50,40,70,.1);

            color: #4a4058;

            font-size: 20px;

            cursor: pointer;

        }

        #cerrarMensaje:hover {

            background:
                rgba(50,40,70,.2);

        }


        /* =====================================================
           TRANSICION AL UNIVERSO
        ===================================================== */

        #flash {

            position: fixed;

            inset: 0;

            z-index: 450;

            background: white;

            opacity: 0;

            pointer-events: none;

        }

        #flash.activar {

            animation:
                flashUniverso 2.2s ease forwards;

        }

        @keyframes flashUniverso {

            0% {
                opacity: 0;
            }

            35% {
                opacity: .9;
            }

            100% {
                opacity: 0;
            }

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            #contenidoEntrada {
                bottom: 60px;
            }

            #contenidoEntrada .pequeno {
                font-size: 8px;
                letter-spacing: 4px;
            }

            #contenidoEntrada h1 {
                font-size: 25px;
                letter-spacing: 6px;
            }

            #contenidoEntrada p {
                font-size: 10px;
                padding: 0 20px;
            }

            #agujeroEntrada {
                width: 170px;
                height: 170px;
            }

            #titulo {
                top: 22px;
            }

            #titulo h1 {
                font-size: 20px;
                letter-spacing: 5px;
            }

            #titulo p {
                font-size: 10px;
            }

            .sobre {
                padding: 65px 28px 40px;
                min-height: 350px;
            }

            .papel h2 {
                font-size: 25px;
            }

            .papel p {
                font-size: 19px;
            }

        }

    </style>

</head>

{

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =====================================================
   ESCENA
===================================================== */

const escena =
    new THREE.Scene();

escena.background =
    new THREE.Color(0x000005);

escena.fog =
    new THREE.FogExp2(
        0x000005,
        0.00055
    );


/* =====================================================
   CAMARA
===================================================== */

const camara =
    new THREE.PerspectiveCamera(

        60,

        window.innerWidth /
        window.innerHeight,

        .1,

        5000

    );

camara.position.set(
    0,
    170,
    650
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: false,

        powerPreference:
            "high-performance"

    });

renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);

renderer.setSize(

    window.innerWidth,
    window.innerHeight

);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


document
    .getElementById("contenedor")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   CONTROLES
===================================================== */

const controles =
    new OrbitControls(
        camara,
        renderer.domElement
    );

controles.enableDamping =
    true;

controles.dampingFactor =
    .035;

controles.enablePan =
    false;

controles.minDistance =
    180;

controles.maxDistance =
    1200;

controles.autoRotate =
    true;

controles.autoRotateSpeed =
    .12;


/* =====================================================
   LUZ
===================================================== */

const luz =
    new THREE.PointLight(
        0xffffff,
        7,
        900
    );

escena.add(luz);


/* =====================================================
   TEXTURAS
===================================================== */

const texturaLoader =
    new THREE.TextureLoader();


/* =====================================================
   PLANETA
===================================================== */

let planeta = null;

texturaLoader.load(

    "fotos/planeta.jpg",

    function(textura) {

        textura.colorSpace =
            THREE.SRGBColorSpace;

        const geometria =
            new THREE.SphereGeometry(
                70,
                64,
                64
            );

        const material =
            new THREE.MeshStandardMaterial({

                map: textura,

                roughness: .75,

                metalness: .1

            });

        planeta =
            new THREE.Mesh(
                geometria,
                material
            );

        escena.add(planeta);

    }

);


/* =====================================================
   ATMOSFERA
===================================================== */

const atmosfera =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            75,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color: 0x6875ff,

            transparent: true,

            opacity: .13,

            side:
                THREE.BackSide,

            depthWrite:
                false

        })

    );

escena.add(atmosfera);


/* =====================================================
   ANILLO
===================================================== */

const anillo =
    new THREE.Mesh(

        new THREE.RingGeometry(
            100,
            128,
            160
        ),

        new THREE.MeshBasicMaterial({

            color: 0xb5adff,

            transparent: true,

            opacity: .5,

            side:
                THREE.DoubleSide,

            depthWrite:
                false

        })

    );

anillo.rotation.x =
    Math.PI / 2.4;

escena.add(anillo);


/* =====================================================
   ESTRELLAS DEL FONDO
===================================================== */

const cantidadFondo =
    10000;

const posicionesFondo =
    new Float32Array(
        cantidadFondo * 3
    );

for (
    let i = 0;
    i < cantidadFondo;
    i++
) {

    const radio =
        900 +
        Math.random() * 2200;

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    posicionesFondo[i * 3] =

        radio *
        Math.sin(phi) *
        Math.cos(theta);

    posicionesFondo[i * 3 + 1] =

        radio *
        Math.sin(phi) *
        Math.sin(theta);

    posicionesFondo[i * 3 + 2] =

        radio *
        Math.cos(phi);

}

const fondoGeometry =
    new THREE.BufferGeometry();

fondoGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        posicionesFondo,
        3
    )

);

const fondoMaterial =
    new THREE.PointsMaterial({

        color: 0xffffff,

        size: 1.6,

        transparent: true,

        opacity: .8,

        depthWrite: false

    });

const fondo =
    new THREE.Points(

        fondoGeometry,

        fondoMaterial

    );

escena.add(fondo);


/* =====================================================
   GALAXIA
===================================================== */

const galaxia =
    new THREE.Group();

escena.add(galaxia);


const cantidadGalaxia =
    5500;

const posicionesGalaxia =
    new Float32Array(
        cantidadGalaxia * 3
    );

for (
    let i = 0;
    i < cantidadGalaxia;
    i++
) {

    const radio =
        Math.pow(
            Math.random(),
            .55
        ) * 600;

    const brazos = 5;

    const brazo =
        Math.floor(
            Math.random() *
            brazos
        );

    const angulo =

        (brazo / brazos) *
        Math.PI * 2 +

        radio * .018;

    const desviacion =

        (Math.random() - .5) *
        75;

    posicionesGalaxia[i * 3] =

        Math.cos(angulo) *
        radio +
        desviacion;

    posicionesGalaxia[i * 3 + 1] =

        (Math.random() - .5) *
        45;

    posicionesGalaxia[i * 3 + 2] =

        Math.sin(angulo) *
        radio +
        desviacion;

}

const galaxiaGeometry =
    new THREE.BufferGeometry();

galaxiaGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        posicionesGalaxia,
        3
    )

);

const galaxiaMaterial =
    new THREE.PointsMaterial({

        color: 0xaaaaff,

        size: 2.2,

        transparent: true,

        opacity: .72,

        depthWrite: false

    });

const particulasGalaxia =
    new THREE.Points(

        galaxiaGeometry,

        galaxiaMaterial

    );

galaxia.add(
    particulasGalaxia
);


/* =====================================================
   HALO
===================================================== */

function crearHalo() {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 128;
    canvas.height = 128;

    const contexto =
        canvas.getContext("2d");

    const gradiente =
        contexto.createRadialGradient(

            64,
            64,
            0,

            64,
            64,
            64

        );

    gradiente.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradiente.addColorStop(
        .08,
        "rgba(255,255,255,1)"
    );

    gradiente.addColorStop(
        .25,
        "rgba(180,190,255,.8)"
    );

    gradiente.addColorStop(
        .55,
        "rgba(100,110,255,.3)"
    );

    gradiente.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    contexto.fillStyle =
        gradiente;

    contexto.fillRect(
        0,
        0,
        128,
        128
    );

    const textura =
        new THREE.CanvasTexture(
            canvas
        );

    textura.colorSpace =
        THREE.SRGBColorSpace;

    return textura;

}

const texturaHalo =
    crearHalo();


/* =====================================================
   FOTOS
===================================================== */

const nombresFotos = [

    "foto1.jpg",

    "foto6.jpg"

const datosFotos = [

    },

    {

    },

    {

    },

    {
        radio: 390,

    },

    {
        radio: 580,

        velocidad: .0008,
        escala: .78
    },

    {
        radio: 730,

    },

    {

        velocidad: .0011,

    },

    {
        radio: 650,
        altura: -40,
        velocidad: .0007,
        escala: .76
    },

    {
        radio: 850,
        altura: 150,
        velocidad: .0004,
        escala: .62
    },

    {
        radio: 320,
        altura: -120,
        velocidad: .0017,
        escala: .98
    },

    {
        radio: 500,
        altura: 260,
        velocidad: .0009,
        escala: .84
    }

];


const grupoFotos =
    new THREE.Group();

escena.add(
    grupoFotos
);

const fotosObjetos = [];


/* =====================================================
   CREAR FOTOS SIN PARPADEO
===================================================== */

datosFotos.forEach(

    (datos, indice) => {

        const archivo =
            nombresFotos[
                indice %
                nombresFotos.length
            ];


        const textura =
            texturaLoader.load(

                "fotos/" +
                archivo,

                function(tex) {

                    tex.colorSpace =
                        THREE.SRGBColorSpace;

                }

            );


        /*
            SPRITE EN VEZ DE PLANO.

            Esto evita el problema de
            lookAt() + transparencia.
        */

        const foto =
            new THREE.Sprite(

                new THREE.SpriteMaterial({

                    map: textura,

                    transparent: true,

                    opacity: 1,

                    depthWrite: false,

                    depthTest: true,

                    alphaTest: .02

                })

            );


        const tamaño =
            82 *
            datos.escala;

        foto.scale.set(
            tamaño,
            tamaño,
            1
        );


        foto.userData.angulo =
            Math.random() *
            Math.PI * 2;

        foto.userData.radio =
            datos.radio;

        foto.userData.altura =
            datos.altura;

        foto.userData.velocidad =
            datos.velocidad;

        foto.userData.indice =
            indice;


        /*
            Halo independiente.
        */

        const halo =
            new THREE.Sprite(

                new THREE.SpriteMaterial({

                    map:
                        texturaHalo,

                    color:
                        0x8994ff,

                    transparent:
                        true,

                    opacity:
                        .09,

                    blending:
                        THREE.NormalBlending,

                    depthWrite:
                        false,

                    depthTest:
                        false

                })

            );


        halo.scale.set(
            tamaño * 1.35,
            tamaño * 1.35,
            1
        );


        grupoFotos.add(
            halo
        );

        grupoFotos.add(
            foto
        );


        foto.userData.halo =
            halo;


        fotosObjetos.push(
            foto
        );

    }

);


/* =====================================================
   MENSAJES
===================================================== */

const recuerdos = [

    "Desde que llegaste, mi universo cambió.",

    "Entre millones de estrellas, siempre te elegiría a ti.",

    "Mi lugar favorito siempre termina siendo contigo.",

    "Contigo hasta los días normales se vuelven recuerdos.",

    "Gracias por formar parte de mi universo.",

    "Me gusta imaginar todos los lugares que todavía nos faltan conocer.",

    "Si pudiera guardar un momento para siempre, sería uno contigo.",

    "Hay recuerdos que brillan más que cualquier estrella.",

    "No necesito encontrar otro universo si ya encontré el mío contigo.",

    "Ojalá pudiéramos volver a vivir nuestros mejores días una y otra vez.",

    "Cada momento contigo se convirtió en una pequeña parte de mi universo.",

    "No sé qué nos espera más adelante, pero quiero descubrirlo contigo.",

    "De todas las coincidencias de la vida, conocerte fue mi favorita.",

    "A veces miro las estrellas y pienso en lo increíble que fue encontrarte.",

    "Si nuestra historia fuera una galaxia, todavía estaría naciendo.",

    "Gracias por todos esos momentos que probablemente nunca olvidaré.",

    "Mi universo tiene millones de puntos de luz, pero tú siempre destacas.",

    "Y todavía nos quedan muchas estrellas por descubrir."

];


const posicionesEstrellas = [

    [-250, 90, 130],
    [-170, 190, -180],
    [-50, 110, 330],
    [120, 160, -280],
    [250, 100, 180],
    [320, 0, -120],
    [260, -130, 260],
    [80, -170, -320],
    [-100, -200, 270],
    [-270, -140, -220],
    [-350, 50, 40],
    [-320, 220, 100],
    [-80, 300, 150],
    [100, 270, -170],
    [230, 220, 30],
    [370, 120, -250],
    [380, -100, -80],
    [-380, -80, 180]

];


const estrellasEspeciales = [];


/* =====================================================
   ESTRELLAS ESPECIALES
===================================================== */

posicionesEstrellas.forEach(

    (posicion, indice) => {

        const grupo =
            new THREE.Group();

        grupo.position.set(

            posicion[0],
            posicion[1],
            posicion[2]

        );

        grupo.userData.texto =
            recuerdos[indice];


        const halo =
            new THREE.Sprite(

                new THREE.SpriteMaterial({

                    map:
                        texturaHalo,

                    color:
                        0x9ea8ff,

                    transparent:
                        true,

                    opacity:
                        .8,

                    blending:
                        THREE.NormalBlending,

                    depthWrite:
                        false,

                    depthTest:
                        false

                })

            );


        halo.scale.set(
            45,
            45,
            1
        );


        grupo.add(
            halo
        );


        const nucleo =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    5,
                    16,
                    16
                ),

                new THREE.MeshBasicMaterial({

                    color:
                        0xffffff

                })

            );


        grupo.add(
            nucleo
        );


        const materialCruz =
            new THREE.LineBasicMaterial({

                color:
                    0xffffff,

                transparent:
                    true,

                opacity:
                    .8

            });


        const puntosCruz = [

            new THREE.Vector3(
                -16,
                0,
                0
            ),

            new THREE.Vector3(
                16,
                0,
                0
            ),

            new THREE.Vector3(
                0,
                -16,
                0
            ),

            new THREE.Vector3(
                0,
                16,
                0
            )

        ];


        const geometriaCruz =
            new THREE.BufferGeometry()
                .setFromPoints(
                    puntosCruz
                );


        const cruz =
            new THREE.LineSegments(

                geometriaCruz,

                materialCruz

            );


        grupo.add(
            cruz
        );


        grupo.userData.halo =
            halo;

        grupo.userData.nucleo =
            nucleo;

        grupo.userData.cruz =
            cruz;

        galaxia.add(
            grupo
        );

        estrellasEspeciales.push(
            grupo
        );

    }

);


/* =====================================================
   RAYCASTER
===================================================== */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


function obtenerMouse(event) {

    mouse.x =

        (event.clientX /
        window.innerWidth) *
        2 - 1;

    mouse.y =

        -(event.clientY /
        window.innerHeight) *
        2 + 1;

}


/* =====================================================
   MENSAJE
===================================================== */

const pantallaMensaje =
    document.getElementById(
        "mensajePantalla"
    );

const textoMensaje =
    document.getElementById(
        "textoMensaje"
    );


function abrirMensaje(texto) {

    textoMensaje.innerText =
        texto;

    pantallaMensaje
        .classList
        .add("visible");

    controles.enabled =
        false;

}


/* =====================================================
   CLICK ESTRELLAS
===================================================== */

renderer.domElement.addEventListener(

    "pointerdown",

    function(event) {

        if (
            !universoActivo
        ) {
            return;
        }


        obtenerMouse(event);


        raycaster.setFromCamera(

            mouse,
            camara

        );


        const objetos =
            raycaster.intersectObjects(

                estrellasEspeciales,
                true

            );


        if (
            objetos.length > 0
        ) {

            let estrella =
                objetos[0].object;


            while (

                estrella.parent &&

                !estrella.userData.texto

            ) {

                estrella =
                    estrella.parent;

            }


            if (
                estrella.userData.texto
            ) {

                abrirMensaje(
                    estrella.userData.texto
                );

            }

        }

    }

);


/* =====================================================
   CERRAR MENSAJE
===================================================== */

document
    .getElementById(
        "cerrarMensaje"
    )
    .addEventListener(

        "click",

        function() {

            pantallaMensaje
                .classList
                .remove(
                    "visible"
                );

            controles.enabled =
                true;

        }

    );


/* =====================================================
   ESC
===================================================== */

window.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Escape"
        ) {

            pantallaMensaje
                .classList
                .remove(
                    "visible"
                );

            controles.enabled =
                true;

        }

    }

);


/* =====================================================
   ENTRADA
===================================================== */

const entrada =
    document.getElementById(
        "entrada"
    );

const botonEntrar =
    document.getElementById(
        "entrar"
    );

const titulo =
    document.getElementById(
        "titulo"
    );

const ayuda =
    document.getElementById(
        "ayuda"
    );

const flash =
    document.getElementById(
        "flash"
    );


let universoActivo =
    false;

let entrando =
    false;


/* =====================================================
   ESTRELLAS DE LA ENTRADA
===================================================== */

const contenedorEstrellasEntrada =
    document.getElementById(
        "estrellasEntrada"
    );


for (
    let i = 0;
    i < 180;
    i++
) {

    const estrella =
        document.createElement(
            "div"
        );

    estrella.className =
        "estrellaEntrada";

    estrella.style.left =
        Math.random() * 100 + "%";

    estrella.style.top =
        Math.random() * 100 + "%";

    estrella.style.animationDelay =
        Math.random() * 3 + "s";

    const tamaño =
        Math.random() * 2 + 1;

    estrella.style.width =
        tamaño + "px";

    estrella.style.height =
        tamaño + "px";

    contenedorEstrellasEntrada
        .appendChild(
            estrella
        );

}


/* =====================================================
   ENTRAR AL UNIVERSO
===================================================== */

botonEntrar.addEventListener(

    "click",

    function() {

        if (entrando) {
            return;
        }

        entrando = true;

        botonEntrar.innerText =
            "ABRIENDO...";

        botonEntrar.style.pointerEvents =
            "none";


        /*
            Desactivamos controles
            durante la entrada.
        */

        controles.enabled =
            false;


        /*
            Acercamiento cinematográfico.
        */

        const posicionInicial =
            camara.position.clone();

        const objetivo =
            new THREE.Vector3(
                0,
                40,
                230
            );


        const inicio =
            performance.now();


        function acercamientoEntrada(
            ahora
        ) {

            const progreso =
                Math.min(
                    (ahora - inicio) /
                    2200,
                    1
                );


            const suave =
                1 -
                Math.pow(
                    1 - progreso,
                    3
                );


            camara.position.lerpVectors(

                posicionInicial,

                objetivo,

                suave

            );


            camara.lookAt(
                0,
                0,
                0
            );


            if (
                progreso < 1
            ) {

                requestAnimationFrame(
                    acercamientoEntrada
                );

            } else {

                terminarEntrada();

            }

        }


        requestAnimationFrame(
            acercamientoEntrada
        );

    }

);


/* =====================================================
   TERMINAR ENTRADA
===================================================== */

function terminarEntrada() {

    flash.classList.add(
        "activar"
    );


    setTimeout(

        function() {

            entrada.classList.add(
                "oculta"
            );

            titulo.classList.add(
                "visible"
            );

            ayuda.classList.add(
                "visible"
            );


            universoActivo =
                true;


            /*
                Devolvemos la cámara
                a la posición del universo.
            */

            camara.position.set(
                0,
                170,
                650
            );


            controles.target.set(
                0,
                0,
                0
            );


            controles.enabled =
                true;


            controles.autoRotate =
                true;

        },

        700

    );


    setTimeout(

        function() {

            flash.classList.remove(
                "activar"
            );

        },

        2500

    );

}


/* =====================================================
   ANIMACION
===================================================== */

const reloj =
    new THREE.Clock();


function animar() {

    requestAnimationFrame(
        animar
    );


    const tiempo =
        reloj.getElapsedTime();


    /* =================================================
       PLANETA
    ================================================= */

    if (planeta) {

        planeta.rotation.y =
            tiempo * .08;

    }


    /* =================================================
       ATMOSFERA
    ================================================= */

    const escalaAtmosfera =

        1 +

        Math.sin(
            tiempo * 1.3
        ) *

        .018;


    atmosfera.scale.setScalar(
        escalaAtmosfera
    );


    /* =================================================
       ANILLO
    ================================================= */

    anillo.rotation.z =
        tiempo * .12;


    /* =================================================
       GALAXIA
    ================================================= */

    galaxia.rotation.y =
        tiempo * .018;


    particulasGalaxia.rotation.y =
        tiempo * .006;


    fondo.rotation.y =
        tiempo * .0015;


    /* =================================================
       FOTOS
    ================================================= */

    fotosObjetos.forEach(

        (foto, indice) => {

            foto.userData.angulo +=
                foto.userData.velocidad;


            const angulo =
                foto.userData.angulo;


            const radio =
                foto.userData.radio;


            const x =

                Math.cos(angulo) *
                radio;


            const z =

                Math.sin(angulo) *
                radio;


            const y =

                foto.userData.altura +

                Math.sin(angulo * 1.4) *
                35;


            foto.position.set(

                x,
                y,
                z

            );


            /*
                Sprite:
                no usamos lookAt().
                No hay cambio brusco de
                orientación.
            */


            const pulso =

                1 +

                Math.sin(

                    tiempo * 1.2 +
                    indice

                ) *

                .025;


            const tamaño =
                82 *
                datosFotos[indice].escala *
                pulso;


            foto.scale.set(
                tamaño,
                tamaño,
                1
            );


            /*
                Halo sigue exactamente
                a su fotografía.
            */

            const halo =
                foto.userData.halo;


            halo.position.copy(
                foto.position
            );


            halo.scale.set(

                tamaño * 1.35,
                tamaño * 1.35,
                1

            );

        }

    );


    /* =================================================
       ESTRELLAS ESPECIALES
    ================================================= */

    estrellasEspeciales.forEach(

        (estrella, indice) => {

            const pulso =

                1 +

                Math.sin(

                    tiempo * 2.2 +
                    indice

                ) *

                .18;


            estrella.userData.halo
                .scale.set(

                    45 * pulso,
                    45 * pulso,
                    1

                );


            estrella.userData.nucleo
                .scale.setScalar(
                    pulso
                );


            estrella.userData.cruz
                .scale.setScalar(
                    pulso
                );


            estrella.rotation.z =

                tiempo *
                (.2 + indice * .01);

        }

    );


    /* =================================================
       CONTROLES
    ================================================= */

    controles.update();


    renderer.render(
        escena,
        camara
    );

}


animar();


/* =====================================================
   RESPONSIVE
===================================================== */

window.addEventListener(

    "resize",

    function() {

        camara.aspect =

            window.innerWidth /
            window.innerHeight;


        camara.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>
